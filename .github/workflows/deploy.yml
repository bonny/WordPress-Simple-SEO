name: Deploy Tag to WordPress.org
# Tag pushes only. No workflow_dispatch: a manual run has no tag, so the 10up action
# would take the branch ref as the version and push main to SVN trunk.
on:
    push:
        tags:
            # Semver (https://semver.org/) release pattern.
            - '[0-9]+.[0-9]+.[0-9]+*'
jobs:
    tag:
        name: Deploy Tag
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            # No build step: plain PHP and CSS.

            - name: Install SVN (Subversion)
              run: |
                  sudo apt-get update
                  sudo apt-get install subversion

            # Deploys trunk + tag to WordPress.org SVN (using .distignore to exclude
            # internal files from the zip) and syncs .wordpress-org/ to SVN assets/.
            - name: WordPress.org Plugin Deploy
              uses: 10up/action-wordpress-plugin-deploy@stable
              env:
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SLUG: simple-seo
