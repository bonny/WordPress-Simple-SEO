<!doctype html>
<!--
	Source of demo-share-image.png, the demo company's default share image in the screenshots.
	Render at 1200 × 630 with Playwright (browser_run_code_unsafe):
		const ctx = await page.context().browser().newContext( { viewport: { width: 1200, height: 630 } } );
		const p = await ctx.newPage();
		await p.goto( 'file://' + <absolute path to this file> ); // or p.setContent( <this file's HTML> )
		await p.screenshot( { path: '.claude/skills/visual-check/demo-share-image.png' } );
	Then pngquant + oxipng, like the screenshots (see SKILL.md).
-->

<head>

<style>

	.mark { position: absolute; right: 110px; top: 118px; width: 250px; height: 250px; border: 3px solid #d9a55b; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
</style>
</head>
