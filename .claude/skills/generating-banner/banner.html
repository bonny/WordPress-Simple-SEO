<!doctype html>
<!-- WordPress.org banner for Simple SEO. Rendered by render.js at 772x250 (1x and 2x).
     Option C from the 2026-09-25 design canvas, picked after a request for
     something simpler: the name and the icon's search-result card on flat icon yellow.
     The card bleeds off the bottom edge on purpose. -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Quicksand; src: url(fonts/Quicksand.ttf); font-weight: 300 700; }
body { margin: 0; }
.banner { position: relative; width: 772px; height: 250px; overflow: hidden; background: #FFD23F; color: #1e1b3a; font-family: Quicksand, sans-serif; }
h1 { position: absolute; left: 64px; top: 50%; transform: translateY(-50%); margin: 0; font-size: 56px; font-weight: 700; letter-spacing: -1px; }
.card { position: absolute; left: 430px; top: 44px; }
</style>
</head>
<body>
<div class="banner">
	<h1>Simple SEO</h1>
	<svg class="card" aria-hidden="true" width="330" height="262" viewBox="0 0 176 140" xmlns="http://www.w3.org/2000/svg">
		<rect width="176" height="140" rx="18" fill="#ffffff"/>
		<rect x="22" y="22" width="74" height="9" rx="4.5" fill="#1ea362"/>
		<rect x="22" y="42" width="124" height="16" rx="8" fill="#2f6fed"/>
		<rect x="22" y="76" width="132" height="9" rx="4.5" fill="#c9ccd3"/>
		<rect x="22" y="96" width="100" height="9" rx="4.5" fill="#c9ccd3"/>
	</svg>
</div>
</body>
</html>
