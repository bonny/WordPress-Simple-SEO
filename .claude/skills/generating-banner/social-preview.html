<!doctype html>
<!-- GitHub social preview for bonny/simple-seo (1280x640, GitHub's recommended size), rendered
     by render.js to .github/social-preview.png. Upload it by hand: repo Settings → General →
     Social preview (GitHub has no API for it). Same look as banner.html, plus a one-line tagline,
     since a link preview without the WordPress.org page around it needs to say what this is. -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Quicksand; src: url(fonts/Quicksand.ttf); font-weight: 300 700; }
@font-face { font-family: Nunito; src: url(fonts/Nunito.ttf); font-weight: 200 1000; }
body { margin: 0; }
.preview { position: relative; width: 1280px; height: 640px; overflow: hidden; background: #FFD23F; color: #1e1b3a; }
.text { position: absolute; left: 96px; top: 50%; transform: translateY(-50%); }
h1 { margin: 0; font-family: Quicksand, sans-serif; font-size: 104px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
p { margin: 28px 0 0; font-family: Nunito, sans-serif; font-size: 34px; font-weight: 600; line-height: 1.3; color: #3b3657; }
.card { position: absolute; left: 760px; top: 150px; }
</style>
</head>
<body>
<div class="preview">
	<div class="text">
		<h1>Simple SEO</h1>
		<p>The SEO basics for WordPress.<br>Nothing more.</p>
	</div>
	<svg class="card" aria-hidden="true" width="560" height="445" viewBox="0 0 176 140" xmlns="http://www.w3.org/2000/svg">
		<rect width="176" height="140" rx="18" fill="#ffffff"/>
		<rect x="22" y="22" width="74" height="9" rx="4.5" fill="#1ea362"/>
		<rect x="22" y="42" width="124" height="16" rx="8" fill="#2f6fed"/>
		<rect x="22" y="76" width="132" height="9" rx="4.5" fill="#c9ccd3"/>
		<rect x="22" y="96" width="100" height="9" rx="4.5" fill="#c9ccd3"/>
	</svg>
</div>
</body>
</html>
